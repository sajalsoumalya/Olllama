version: '3.8'

services:
  ollama:
    image: ollama/ollama:latest
    container_name: ollama
    environment:
      - OLLAMA_HOST=0.0.0.0        # IMPORTANT: Allows external connections
      - TZ=Asia/Kolkata
    volumes:
      - ollama_data:/root/.ollama
    ports:
      - "11434:11434"              # Exposes port to the VPS
    # Auto-pulls Gemma 4 Edge 2B on startup
    entrypoint: >
      sh -c "ollama serve & sleep 5 && ollama pull gemma4:e2b && wait"
    deploy:
      resources:
        limits:
          cpus: '2.5'              # Optimized for your 3-core setup
          memory: 8G               # Leaves plenty of room for 16GB RAM
    restart: unless-stopped

volumes:
  ollama_data:
